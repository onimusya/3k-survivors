<head>

<style>
  html,body{margin:0;padding:0;background:#070a10;overflow:hidden;height:100%;width:100%;touch-action:none;-webkit-font-smoothing:none;font-smooth:never;font-family:monospace;}
  #app{position:fixed;inset:0;}
  #app::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 58%,rgba(4,7,12,0.68) 100%);}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
  #preloader{
    position:fixed;inset:0;z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 38%,#1c1417 0%,#0b0f17 65%,#05070b 100%);
    color:#f5e6c8;padding:20px;box-sizing:border-box;
    transition:opacity 0.42s ease,visibility 0.42s ease;
  }
  #preloader.preloader-hide{opacity:0;visibility:hidden;pointer-events:none;}
  .pl-card{
    width:min(356px,92vw);
    background:linear-gradient(180deg,#151c28 0%,#0d121a 100%);
    border:2px solid #d4a017;
    border-radius:8px;
    box-shadow:0 12px 36px rgba(0,0,0,0.85),inset 0 0 0 1px rgba(255,230,148,0.22);
    padding:22px 18px 18px;
    text-align:center;
    position:relative;
  }
  .pl-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,#991b1b,#f59e0b,#fde047,#f59e0b,#991b1b);
  }
  .pl-bagua{
    width:68px;height:68px;margin:0 auto 12px;
    animation:pl-spin 9s linear infinite;
    filter:drop-shadow(0 0 10px rgba(245,200,76,0.45));
  }
  @keyframes pl-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .pl-title{
    font-size:21px;font-weight:bold;color:#f5c84c;letter-spacing:2px;
    text-shadow:0 2px 0 #000,0 0 12px rgba(245,200,76,0.35);
    margin:0 0 4px;
  }
  .pl-sub{
    font-size:10px;color:#d6b87c;letter-spacing:1.4px;margin:0 0 16px;font-weight:bold;
  }
  .pl-bar-wrap{
    width:100%;height:16px;background:#080c12;
    border:1.5px solid #8f7a3e;border-radius:4px;
    padding:2px;box-sizing:border-box;position:relative;overflow:hidden;
  }
  #preloader-bar{
    height:100%;width:4%;
    background:linear-gradient(90deg,#b91c1c 0%,#ea580c 45%,#facc15 85%,#fef08a 100%);
    border-radius:2px;
    transition:width 0.14s ease-out;
    box-shadow:0 0 10px rgba(250,204,21,0.55);
  }
  .pl-meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:8px;font-size:10.5px;font-weight:bold;
  }
  #preloader-status{color:#9ec5e8;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76%;}
  #preloader-pct{color:#fde047;}
  .pl-tip{
    margin-top:14px;padding-top:10px;border-top:1px solid #232f3e;
    font-size:9.5px;color:#94a3b8;line-height:1.4;
  }
</style>
</head>
<body>
<div id="preloader">
  <div class="pl-card">
    <svg class="pl-bagua" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,4 82,18 96,50 82,82 50,96 18,82 4,50 18,18" fill="#17202c" stroke="#f5c84c" stroke-width="3"/>
      <polygon points="50,12 76,24 88,50 76,76 50,88 24,76 12,50 24,24" fill="#0d131c" stroke="#d97706" stroke-width="1.8"/>
      <circle cx="50" cy="50" r="22" fill="#f5c84c" stroke="#fde047" stroke-width="2"/>
      <path d="M50 28 A22 22 0 0 1 50 72 A11 11 0 0 1 50 50 A11 11 0 0 0 50 28 Z" fill="#111827"/>
      <circle cx="50" cy="39" r="3.5" fill="#f5c84c"/>
      <circle cx="50" cy="61" r="3.5" fill="#111827"/>
    </svg>
    <div class="pl-title">3K SURVIVORS</div>
    <div class="pl-sub">ROMANCE OF THE THREE KINGDOMS</div>
    <div class="pl-bar-wrap">
      <div id="preloader-bar"></div>
    </div>
    <div class="pl-meta">
      <span id="preloader-status">INITIALIZING BATTLEFIELD ENGINE...</span>
      <span id="preloader-pct">4%</span>
    </div>
    <div class="pl-tip" id="preloader-tip">TIP: Press SPACE/R at 100% Musou to unleash your Warrior Ultimate &amp; Sworn Partner Combo!</div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
